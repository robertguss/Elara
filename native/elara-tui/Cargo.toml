[package]
name = "elara-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
libc = "0.2"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
tui-markdown = { version = "0.3.9", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
