[package]
name = "elara-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
libc = "0.2"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
pulldown-cmark = "0.13"
serde_json = "1"
tempfile = "3"
tree-sitter-highlight = "0.26.3"
tree-sitter-elixir = "0.3.5"
tree-sitter-heex = "0.8.1"
tree-sitter-rust = "0.24.2"
tree-sitter-bash = "0.25.1"
tree-sitter-json = "0.24.8"
tree-sitter-md = { version = "0.5.3", default-features = false }
tui-markdown = { version = "0.3.9", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
