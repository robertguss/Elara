# pstack.config.yaml: which model each pstack role uses, per harness.
# Yours to edit; pstack-portable sync never overwrites a value, it only appends roles upstream adds.
# Edits apply on the next subagent spawn, no re-sync needed.
#
# Keys are pstack's role labels slugged: "feature, refactoring" -> feature-refactoring.
# Values: a model id, "model@effort" (effort: low|medium|high|xhigh|max), or "inherit"
# (no explicit model; for Amp, see the amp note below).
# List values are panels: one subagent per entry.
#   amp:         provider/model ids from `amp plugins show-agent-options`
#                Never anthropic/*: pstack_subagent starts Amp-native threads, and a Claude Pro/Max
#                plan serves only Amp's Claude Code mode, so those children error before their first turn.
#                Delegation path for an amp value, by the parent thread's mode:
#                - Claude Code mode (external-agent:claude-code): inherit -> the Agent (Task) tool, a Claude
#                  Code subagent on the parent's Claude model, billed to the Claude plan.
#                - Amp-native modes (low/medium/high/ultra, official-modes plugin modes, raw models):
#                  inherit -> Amp's Task subagent on Amp's routed Task model, not necessarily the parent's.
#                - Either mode: a provider/model id -> pstack_subagent, an Amp-native thread on that model,
#                  served by its model-routing connection (xai/* by the SuperGrok subscription).
#   claude-code: opus | sonnet | haiku | fable, or a full claude-* id (effort is ignored)
#   codex:       a Codex model id, e.g. the one `codex` prints at startup
#   grok:        a Grok Build model id from `grok models` (effort is ignored)
roles:
  feature-refactoring: # pstack role "feature, refactoring" (Cursor default: grok-4.7-xhigh-fast)
    amp: xai/grok-4.6
    claude-code: sonnet
    codex: inherit
    grok: grok-4.7-build-fast
  bug-fix: # pstack role "bug-fix" (Cursor default: grok-4.7-xhigh-fast)
    amp: xai/grok-4.6
    claude-code: sonnet
